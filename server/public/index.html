<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerede Kılacağım? · Denetim Paneli</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23059369'/><path d='M22 18l10 10 10-10' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M32 28v6' stroke='white' stroke-width='4' stroke-linecap='round'/><path d='M24 42v11h16V42' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M20 32v7M44 32v7' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-deco" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>Nerede Kılacağım?</h1>
      <p>Denetim Paneli</p>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section id="loginView" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="login-icon">🔐</div>
      <h2>Yönetici Girişi</h2>
      <p class="sub">Devam etmek için yönetici şifresini girin.</p>
      <input type="password" id="pass" placeholder="Şifre" autocomplete="current-password" required>
      <button type="submit">Giriş Yap</button>
      <p class="err" id="loginErr"></p>
    </form>
  </section>

  <section id="panelView" class="hidden">
    <nav class="tabs" id="tabs"></nav>
    <div class="toolbar">
      <div class="search-wrap" id="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="searchInput" placeholder="Ara: mescit, e-posta…">
      </div>
      <button id="maintBtn" type="button" class="danger" hidden>Bakıma Al</button>
      <button id="refreshBtn" type="button" class="ghost">↻ Yenile</button>
      <button id="logoutBtn" type="button" class="ghost logout">Çıkış</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImg" alt="">
  <button class="close" id="lbClose" aria-label="Kapat">&times;</button>
</div>

<script src="app.js"></script>
</body>
</html>
